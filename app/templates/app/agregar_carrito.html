{% extends 'app/base.html' %}

{% block content %}
<section class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card p-4 shadow-sm border-1 w-100" style="max-width: 420px; background-color: var(--fondo-tarjeta); border-radius: 12px;">
        <header class="text-center mb-4 border-bottom pb-3">
            <h2 class="h4 fw-bold text-dark mb-1">Agregar al Carrito</h2>
            <h3 class="h5 fw-semibold mt-2" style="color: var(--primario);">{{ producto.nombre }}</h3>
            <p class="fs-4 fw-bold my-2" style="color: var(--primario);">{{ producto.precio_base }}€</p>
            <p class="text-muted small mb-0">Disponible: {{ producto.cantidad }}</p>
        </header>

        <form method="post" class="d-flex flex-column gap-3">
            {% csrf_token %}

            <div class="d-flex flex-column gap-1 text-start">
                <label for="id_cantidad" class="fw-semibold text-dark small mb-1">Cantidad:</label>
                {{ form.cantidad }}
            </div>

            <div class="d-flex flex-column gap-2 mt-3">
                <button type="submit" class="btn btn-primario py-2 w-100 rounded-pill">
                    <i class="fa-solid fa-cart-plus me-1"></i> Agregar al Carrito
                </button>
                <a href="{% url 'producto_lista' %}" class="text-center small text-decoration-none text-muted mt-1">Volver a Productos</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
