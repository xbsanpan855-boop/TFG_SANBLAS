{% extends 'app/base.html' %}

{% block title %}Agregar Saldo | Frutos Secos San Blas{% endblock %}

{% block content %}
<section class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="card p-4 shadow-sm w-100" style="max-width: 460px; background-color: var(--fondo-tarjeta); border-radius: 12px; border: 1px solid var(--borde);">
        
        <header class="text-center mb-4 pb-3 border-bottom">
            <div class="mb-2">
                <i class="fa-solid fa-credit-card display-6" style="color: var(--primario);"></i>
            </div>
            <h2 class="h4 fw-bold text-dark mb-1">Pago</h2>
            <p class="text-muted small mb-0">Introduce los datos de tu tarjeta para recargar tu saldo.</p>
        </header>

        <form method="post" class="d-flex flex-column gap-3">
            {% csrf_token %}
            
            <div class="text-start dynamic-form-labels">
                {{ form.as_p }}
            </div>

            <div class="text-center mt-3 d-flex flex-column gap-3">
                <button type="submit" class="btn btn-primario py-2 w-100 rounded-pill fw-bold">
                    <i class="fa-solid fa-wallet me-1"></i> Confirmar Recarga
                </button>
                <a href="{% url 'inicio' %}" class="text-decoration-none small text-muted mt-2 fw-semibold">Volver al inicio</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
